name: Deploy site to GitHub Pages

# בונה את האתר ב-Vite (npm run build -> dist/) ופורס אותו ל-GitHub Pages.
# הפריסה נכנסת לתוקף רק אחרי שהמקור של Pages הועבר ל-"GitHub Actions"
# (Settings -> Pages -> Build and deployment -> Source). כל עוד המקור הוא
# "Deploy from a branch", הבנייה והבדיקות רצות כרגיל אך שלב הפריסה מדלג,
# והאתר ממשיך להיות מוגש מקובצי המקור שבענף main. ראו "פריסה" ב-README.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# פריסה אחת בכל פעם; פריסה שכבר התחילה אינה מבוטלת באמצע.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pages_source: ${{ steps.source.outputs.build_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Run unit tests
        run: npm test
      - name: Build the site
        run: npm run build
      - name: Upload the build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # "workflow" = המקור הוא GitHub Actions; "legacy" = פריסה מענף.
      - name: Read the Pages source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || echo unknown)"
          echo "build_type=${build_type}" >> "$GITHUB_OUTPUT"
          if [ "$build_type" != "workflow" ]; then
            echo "::notice::מקור Pages הוא '${build_type}', לא GitHub Actions: הבנייה עברה, הפריסה מדלגת והאתר ממשיך לפעול מהענף."
          fi

  deploy:
    needs: build
    if: needs.build.outputs.pages_source == 'workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
