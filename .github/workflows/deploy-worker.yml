name: Deploy Cloudflare Worker
# פריסה לשני ה-Workers מאותו קובץ, לפי הענף:
#   main    → simchas-gallery-api          (ייצור)
#   staging → simchas-gallery-api-staging  (סביבת הניסוי)
# בהפעלה ידנית היעד נבחר בשדה target; יעד production מותר מ-main בלבד, ויעד
# staging מותר מכל ענף (כך אפשר לנסות ענף פיצ'ר על ה-Worker של הניסוי).
# ה-Action לעולם אינו יוצר מסד או דלי: הוא יורש את ה-bindings שכבר מוגדרים
# ב-Worker היעד (bindings_inherit=strict) ונכשל אם GALLERY_DB או GALLERY_BUCKET חסרים.

on:
  push:
    branches: [main, staging]
    paths:
      - cloudflare-worker.js
      - .github/workflows/deploy-worker.yml
      - wrangler.jsonc
  pull_request:
    branches: [main, staging]
    types: [closed]
    paths:
      - cloudflare-worker.js
      - .github/workflows/deploy-worker.yml
      - wrangler.jsonc
  workflow_dispatch:
    inputs:
      target:
        description: "Target Worker: production (simchas-gallery-api, from main only) or staging (simchas-gallery-api-staging)"
        type: choice
        required: true
        default: production
        options:
          - production
          - staging

permissions:
  contents: read

# היעד נגזר מהאירוע: הבחירה הידנית, ואחרת הענף (staging → ניסוי, כל השאר → ייצור).
# אותו ביטוי מופיע גם ב-env של ה-job, כי concurrency אינו יכול לקרוא env.
concurrency:
  group: cloudflare-worker-${{ inputs.target || ((github.ref_name == 'staging' || github.event.pull_request.base.ref == 'staging') && 'staging' || 'production') }}
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 3298021f3289a8f22f48693678cc6e73
      DEPLOY_TARGET: ${{ inputs.target || ((github.ref_name == 'staging' || github.event.pull_request.base.ref == 'staging') && 'staging' || 'production') }}
    steps:
      - name: Resolve target Worker
        run: |
          case "$DEPLOY_TARGET" in
            production)
              worker_name="simchas-gallery-api"
              health_url="https://simchas-gallery-api.0534169095.workers.dev/health"
              ;;
            staging)
              worker_name="simchas-gallery-api-staging"
              health_url="https://simchas-gallery-api-staging.0534169095.workers.dev/health"
              ;;
            *)
              echo "::error::Unknown deploy target: $DEPLOY_TARGET"
              exit 1
              ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$DEPLOY_TARGET" = "production" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Production deploys run from main only (requested ref: $GITHUB_REF_NAME). Choose target=staging to try this branch."
            exit 1
          fi
          {
            echo "CLOUDFLARE_WORKER_NAME=$worker_name"
            echo "HEALTH_URL=$health_url"
          } >> "$GITHUB_ENV"
          echo "Deploying $GITHUB_SHA ($GITHUB_REF_NAME) to $worker_name [$DEPLOY_TARGET]."

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Verify repository
        run: |
          npm run check:syntax
          npm test

      - name: Validate Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Inherit all bindings of the target Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # רק לשחזור (ראו למטה): ערכי סודות שאי אפשר לקרוא מ-Cloudflare.
          RESTORE_SECRET_GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          RESTORE_SECRET_GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          RESTORE_SECRET_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";

          const workerName = process.env.CLOUDFLARE_WORKER_NAME;
          const apiBase = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${workerName}`;
          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` };
          const REQUIRED = ["GALLERY_DB", "GALLERY_BUCKET"];
          const namesOf = list => [...new Set((list || []).map(item => String(item?.name || "").trim()).filter(Boolean))];
          const hasRequired = names => REQUIRED.every(name => names.includes(name));

          async function api(path) {
            const response = await fetch(`${apiBase}${path}`, { headers });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.success !== true) {
              throw new Error(`Cloudflare API ${path} failed (${response.status}): ${JSON.stringify(payload?.errors || payload)}`);
            }
            return payload.result;
          }

          // מצב רגיל: הגרסה האחרונה שהועלתה תקינה, ויורשים ממנה (Cloudflare מקבל
          // בירושה רק את "latest").
          let latestNames = [];
          try {
            latestNames = namesOf(await api("/bindings"));
          } catch (error) {
            throw new Error(`Unable to read the existing bindings of Worker "${workerName}". The Worker must already exist in the Cloudflare dashboard; this workflow never creates it. ${error.message}`);
          }

          let bindings;
          if (hasRequired(latestNames)) {
            bindings = latestNames.map(name => ({ type: "inherit", name }));
            console.log(`Inheriting ${bindings.length} bindings from the latest version of ${workerName}.`);
          } else {
            // שחזור: הגרסה האחרונה שבורה (למשל אחרי Rollback מעל פריסה של Workers
            // Builds). את ה-Bindings לוקחים במפורש מהגרסה הפעילה. סודות אינם
            // ניתנים לקריאה, ולכן ערכיהם נלקחים מסודות GitHub באותו שם.
            console.log(`::warning::The latest version of ${workerName} lacks ${REQUIRED.join("/")}; restoring bindings explicitly from the active version.`);
            const deployments = await api("/deployments");
            const list = Array.isArray(deployments) ? deployments : deployments?.deployments || [];
            const active = list.slice().sort((x, y) => String(y?.created_on || "").localeCompare(String(x?.created_on || "")))[0];
            const activeVersionId = (active?.versions || []).slice().sort((x, y) => Number(y?.percentage || 0) - Number(x?.percentage || 0))[0]?.version_id;
            if (!activeVersionId) throw new Error(`Could not find the active version of ${workerName}.`);
            const detail = await api(`/versions/${activeVersionId}`);
            const source = Array.isArray(detail?.resources?.bindings) ? detail.resources.bindings : [];
            if (!hasRequired(namesOf(source))) {
              throw new Error(`The active version ${activeVersionId} of ${workerName} lacks ${REQUIRED.join("/")}. Roll the Worker back to a version that has them first.`);
            }
            const missingSecrets = [];
            bindings = source.map(binding => {
              if (binding.type === "secret_text") {
                const value = process.env[`RESTORE_SECRET_${binding.name}`];
                if (!value) {
                  missingSecrets.push(binding.name);
                  return null;
                }
                return { type: "secret_text", name: binding.name, text: value };
              }
              if (binding.type === "d1") {
                // ה-API מחזיר לפעמים database_id; ההעלאה מצפה ל-id.
                const { database_id, ...rest } = binding;
                return { ...rest, id: binding.id || database_id };
              }
              return binding;
            });
            if (missingSecrets.length) {
              throw new Error(`Restoring ${workerName} needs the values of its secrets, which Cloudflare never returns. Add these as GitHub Actions secrets (Settings → Secrets and variables → Actions) and run this workflow again: ${missingSecrets.join(", ")}. Nothing was deployed; the active version keeps serving.`);
            }
            console.log(`Restoring ${bindings.length} bindings from active version ${activeVersionId}: ${bindings.map(item => `${item.name}(${item.type})`).join(", ")}.`);
          }

          writeFileSync("worker-metadata.json", JSON.stringify({
            main_module: "cloudflare-worker.js",
            compatibility_date: "2026-08-13",
            bindings,
            annotations: { "workers/message": `GitHub ${process.env.GITHUB_SHA} (${process.env.DEPLOY_TARGET})` }
          }));
          NODE

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # העלאה דרך Versions API ואז פריסה של הגרסה ב-100%. ה-API הישן (PUT
        # ‎/scripts) מקבל רק version_id: "latest" בירושת Bindings, וזה לא מספיק
        # אחרי Rollback, כשהגרסה האחרונה שהועלתה אינה הגרסה הפעילה.
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const workerName = process.env.CLOUDFLARE_WORKER_NAME;
          const apiBase = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${workerName}`;
          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` };

          async function call(path, init, label) {
            const response = await fetch(`${apiBase}${path}`, { ...init, headers: { ...headers, ...(init.headers || {}) } });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.success !== true) {
              console.log(`::error::${label} was rejected by Cloudflare (${response.status}).`);
              console.log(JSON.stringify(payload, null, 2));
              process.exit(1);
            }
            return payload.result;
          }

          const metadata = JSON.parse(readFileSync("worker-metadata.json", "utf8"));
          console.log(`Bindings: ${metadata.bindings.map(item => `${item.name}(${item.type})`).join(", ")}`);
          const form = new FormData();
          form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
          form.append("cloudflare-worker.js", new Blob([readFileSync("cloudflare-worker.js")], { type: "application/javascript+module" }), "cloudflare-worker.js");

          const version = await call("/versions?bindings_inherit=strict", { method: "POST", body: form }, "Version upload");
          const versionId = version?.id;
          if (!versionId) {
            console.log("::error::Cloudflare did not return a version id.");
            process.exit(1);
          }
          console.log(`Uploaded version ${versionId}.`);

          await call("/deployments", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              strategy: "percentage",
              versions: [{ version_id: versionId, percentage: 100 }],
              annotations: { "workers/message": metadata.annotations?.["workers/message"] || "" }
            })
          }, "Deployment");
          console.log(`Cloudflare Worker ${workerName} deployed successfully (version ${versionId} at 100%).`);
          NODE

      - name: Verify Worker health
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            "$HEALTH_URL" \
            --output health-response.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const target = process.env.DEPLOY_TARGET;
            const health = JSON.parse(readFileSync("health-response.json", "utf8"));
            if (health?.success !== true || health?.databaseConnected !== true || health?.bucketConnected !== true) {
              throw new Error(`${target} health check did not confirm D1 and R2.`);
            }
            // ה-Worker חייב לדעת באיזו סביבה הוא רץ: Worker ניסוי בלי ENVIRONMENT=staging
            // (או Worker ייצור שסומן בטעות כניסוי) נכשל כאן.
            if (health?.environment !== target) {
              throw new Error(`${target} Worker reports environment "${health?.environment}". Set the ENVIRONMENT variable on the Worker to "${target}".`);
            }
            // דלי ריק תקין (objectsFound 0): סביבת הניסוי מתחילה בלי מדיה.
            console.log(`${target} health check passed: D1 and R2 are connected, environment "${health.environment}", ${Number(health?.objectsFound) || 0} object(s) sampled.`);
          '
