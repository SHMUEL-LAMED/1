name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - cloudflare-worker.js
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Verify repository
        run: |
          npm run check:syntax
          npm test

      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_D1_DATABASE_ID CLOUDFLARE_R2_BUCKET_NAME; do
            if [ -z "$(printenv "$name")" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secrets:$missing"
            exit 1
          fi

      - name: Create protected Wrangler configuration
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const config = {
            name: "simchas-gallery-api",
            main: "cloudflare-worker.js",
            compatibility_date: "2026-08-13",
            keep_vars: true,
            d1_databases: [{
              binding: "GALLERY_DB",
              database_name: "simchas-gallery-db",
              database_id: process.env.CLOUDFLARE_D1_DATABASE_ID
            }],
            r2_buckets: [{
              binding: "GALLERY_BUCKET",
              bucket_name: process.env.CLOUDFLARE_R2_BUCKET_NAME
            }]
          };
          writeFileSync("wrangler.generated.json", JSON.stringify(config, null, 2));
          NODE

      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.generated.json

