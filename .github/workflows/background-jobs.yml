name: Gallery background jobs
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/background-jobs.yml
      - scripts/background-jobs.mjs
permissions:
  contents: read
  id-token: write
concurrency:
  group: gallery-background-production
  cancel-in-progress: false
jobs:
  process:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GALLERY_API_ORIGIN: https://simchas-gallery-api.0534169095.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install image processing runtime
        run: npx playwright install --with-deps chromium
      - name: Process gallery without a user browser
        run: node scripts/background-jobs.mjs
