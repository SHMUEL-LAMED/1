name: Gallery background jobs
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/background-jobs.yml
      - scripts/background-jobs.mjs
      - scripts/maintenance.mjs
permissions:
  contents: read
  id-token: write
concurrency:
  group: gallery-background-production
  cancel-in-progress: false
jobs:
  process:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BACKGROUND_MAX_ITEMS: ${{ github.event_name == 'push' && '8' || '40' }}
      GALLERY_API_ORIGIN: https://simchas-gallery-api.0534169095.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install image processing runtime
        run: npx playwright install --with-deps chromium
      - name: Process gallery without a user browser
        run: node scripts/background-jobs.mjs
      # אותו job ואותו OIDC: גיבוי D1 יומי, ניקוי סל המחזור אחרי 30 יום, התראה
      # למנהלי־העל ובדיקת קישורים שבורים. רץ גם כשהעיבוד נכשל; Worker שאינו
      # עונה מכשיל את הצעד בהודעה ברורה, ו-GitHub מודיע על ריצה מתוזמנת שנכשלה.
      - name: Daily backup, recycle bin cleanup, alerts and broken links
        if: ${{ !cancelled() }}
        run: node scripts/maintenance.mjs
